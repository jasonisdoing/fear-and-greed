name: Daily Fear & Greed Update

on:
  schedule:
    # UTC 기준 매시 15분, 한국 시간 기준 매시 24분 실행
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily update
        id: update_data
        run: python daily_update.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit updated data
        id: commit_data
        run: |
          if git diff --quiet -- data/cnn_fear_greed_historic_data.json data/cnn_fear_greed_historic_data.csv; then
            echo "No data changes to commit."
            echo "commit_status=no_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cnn_fear_greed_historic_data.json data/cnn_fear_greed_historic_data.csv
          git commit -m "chore: fear and greed data update"
          git push
          echo "commit_status=committed" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (daily update)
        if: ${{ success() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0AK2481V33
          UPDATE_STATUS: ${{ steps.update_data.outputs.status }}
          UPDATE_SUMMARY: ${{ steps.update_data.outputs.summary }}
          COMMIT_STATUS: ${{ steps.commit_data.outputs.commit_status }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN secret is required."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          status_emoji = {
              "updated": "🟢",
              "no_change": "🟡",
              "weekend_skip": "🔵",
          }.get(os.environ["UPDATE_STATUS"], "⚪")

          commit_text = "커밋/푸시 완료" if os.environ.get("COMMIT_STATUS") == "committed" else "커밋 없음"
          text = (
              f"{status_emoji} fear-and-greed 일일 갱신\n"
              f"상태: {os.environ['UPDATE_STATUS']}\n"
              f"{os.environ['UPDATE_SUMMARY']}\n"
              f"{commit_text}\n"
              f"Run: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"
          )

          request = Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps({
                  "channel": os.environ["SLACK_CHANNEL_ID"],
                  "text": text,
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
                  "Content-Type": "application/json; charset=utf-8",
              },
          )

          with urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if not payload.get("ok"):
              raise SystemExit(f"Slack API error: {payload}")
          PY

      - name: Notify Slack (daily update failed)
        if: ${{ failure() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0AK2481V33
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN secret is required."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          text = (
              f"🔴 fear-and-greed 일일 갱신 실패\n"
              f"Workflow: {os.environ['WORKFLOW']}\n"
              f"Repo: {os.environ['REPOSITORY']}\n"
              f"Run: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"
          )

          request = Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps({
                  "channel": os.environ["SLACK_CHANNEL_ID"],
                  "text": text,
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
                  "Content-Type": "application/json; charset=utf-8",
              },
          )

          with urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if not payload.get("ok"):
              raise SystemExit(f"Slack API error: {payload}")
          PY
